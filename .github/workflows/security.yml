name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # Every Monday 9:00 UTC

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6" # GO-2026-6088..6218, GO-2026-5972, GO-2026-5026 (stdlib) fixed in 1.26.6

      - name: Install govulncheck
        # Intentionally @latest: security tools should always use the newest vulnerability database
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
